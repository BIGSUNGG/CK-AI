<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="세로 스크롤 대신 책장 넘기듯 보는 만화 뷰어">
  <title>만화 보기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" aria-label="만화 페이지">
    <div id="base" class="slot"></div>
    <div id="flip" class="slot"></div>
    <div id="bar"><div id="bar-fill"></div></div>
    <div id="hud" aria-live="polite"><span id="counter">1 / 22</span></div>
    <button id="replay" type="button" hidden>다시 보기</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
